<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSIC — GENUS1337</title>
<meta name="description" content="A 3D audiovisual rave environment. Enter the frequency.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --rave-bg:#06001A;
  --rave-a:#9B00FF;
  --rave-b:#00FF41;
}
html,body{width:100%;height:100%;background:var(--rave-bg);overflow:hidden;
  font-family:'JetBrains Mono',monospace;color:#fff;cursor:default;}
/* ---- Background video (see-through layer behind the 3D scene) ---- */
#bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
  z-index:0;opacity:0.6;pointer-events:none;
  filter:saturate(1.15) contrast(1.05);}
/* dark violet tint + vignette so the neon palette still leads and edges stay moody */
#bg-tint{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse at center,rgba(6,0,26,0.25) 0%,rgba(6,0,26,0.72) 100%),
    linear-gradient(rgba(6,0,26,0.45),rgba(6,0,26,0.45));
  mix-blend-mode:multiply;}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:2;}

/* ---- HUD ---- */
.hud{position:fixed;z-index:20;pointer-events:none;
  font-size:0.58rem;letter-spacing:0.22em;text-transform:uppercase;
  color:rgba(255,255,255,0.4);text-shadow:0 0 12px rgba(155,0,255,0.5);}
.hud.tl{top:1.25rem;left:1.5rem;}
.hud.tr{top:1.25rem;right:1.5rem;text-align:right;}
.hud.bl{bottom:1.25rem;left:1.5rem;}
.hud.br{bottom:1.25rem;right:1.5rem;text-align:right;}
.hud a{pointer-events:auto;color:rgba(255,255,255,0.4);text-decoration:none;
  border:1px solid rgba(155,0,255,0.3);padding:0.4rem 0.85rem;display:inline-block;
  transition:all 0.2s;}
.hud a:hover{color:#fff;background:rgba(155,0,255,0.12);border-color:var(--rave-a);}
.hud .bpm{color:var(--rave-b);text-shadow:0 0 12px rgba(0,255,65,0.6);}
.hud .lvl{display:inline-block;width:70px;height:4px;margin-top:6px;
  background:rgba(255,255,255,0.08);position:relative;overflow:hidden;}
.hud .lvl i{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,var(--rave-a),var(--rave-b));}

/* control buttons */
.ctl{pointer-events:auto;}
.ctl button{pointer-events:auto;font-family:inherit;font-size:0.58rem;letter-spacing:0.22em;
  text-transform:uppercase;color:rgba(255,255,255,0.5);background:transparent;
  border:1px solid rgba(155,0,255,0.3);padding:0.4rem 0.7rem;cursor:pointer;
  transition:all 0.2s;margin-left:0.4rem;}
.ctl button:hover{color:#fff;background:rgba(155,0,255,0.12);border-color:var(--rave-a);}

/* volume slider */
.vol-wrap{pointer-events:auto;display:inline-flex;align-items:center;gap:0.5rem;
  vertical-align:middle;margin-right:0.5rem;color:rgba(255,255,255,0.45);}
#vol{pointer-events:auto;-webkit-appearance:none;appearance:none;width:74px;height:3px;
  background:rgba(255,255,255,0.15);outline:none;cursor:pointer;border-radius:2px;
  vertical-align:middle;}
#vol::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:11px;height:11px;
  border-radius:50%;background:var(--rave-a);box-shadow:0 0 8px var(--rave-a);cursor:pointer;}
#vol::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;
  background:var(--rave-a);box-shadow:0 0 8px var(--rave-a);cursor:pointer;}

/* ---- Enter overlay ---- */
#gate{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at center,#0c0330 0%,#050010 70%,#000 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;transition:opacity 0.9s ease;cursor:pointer;}
#gate.gone{opacity:0;pointer-events:none;}
#gate .idx{font-size:0.6rem;letter-spacing:0.35em;color:rgba(255,255,255,0.3);margin-bottom:1.4rem;}
#gate h1{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-0.03em;
  font-size:clamp(3rem,13vw,10rem);line-height:0.85;color:#fff;
  text-shadow:0 0 30px var(--rave-a),0 0 70px var(--rave-a);}
#gate h1.glitch{animation:glitch 0.28s steps(2) infinite;}
@keyframes glitch{
  0%,100%{clip-path:none;transform:none;}
  25%{clip-path:inset(30% 0 45% 0);transform:translate(-4px);}
  50%{clip-path:inset(58% 0 12% 0);transform:translate(4px);}
  75%{clip-path:inset(8% 0 66% 0);transform:translate(-2px);}
}
#gate .cta{margin-top:2.2rem;font-size:0.62rem;letter-spacing:0.3em;text-transform:uppercase;
  color:var(--rave-b);text-shadow:0 0 14px rgba(0,255,65,0.6);}
#gate .cta::after{content:'_';animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
#gate .sub{margin-top:0.9rem;font-size:0.52rem;letter-spacing:0.2em;color:rgba(255,255,255,0.25);}

@media (max-width:600px){
  .hud{font-size:0.5rem;letter-spacing:0.15em;}
  .hud.tl,.hud.bl{left:0.9rem;} .hud.tr,.hud.br{right:0.9rem;}
}
</style>
</head>
<body>
<video id="bg-video" autoplay loop muted playsinline preload="auto" poster="">
  <source src="bg.mp4" type="video/mp4">
</video>
<div id="bg-tint"></div>
<canvas id="scene"></canvas>

<div class="hud tl">GENUS1337 // MUSIC</div>
<div class="hud tr" id="clock">00:00:00 UTC</div>
<div class="hud bl">
  <span class="bpm" id="bpm">128 BPM</span><br>
  LEVEL<div class="lvl"><i id="lvl"></i></div>
</div>
<div class="hud br ctl">
  <span class="vol-wrap">VOL <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></span>
  <button id="mute">SOUND: ON</button>
  <a href="/">&larr; EXIT</a>
</div>

<div id="gate">
  <div class="idx">01 / ENVIRONMENT</div>
  <h1 id="gate-title">MUSIC</h1>
  <div class="cta">CLICK TO ENTER THE FREQUENCY</div>
  <div class="sub">headphones recommended · audio starts on entry</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  'use strict';

  // =========================================================================
  // UTC clock (matches the portal)
  // =========================================================================
  (function(){
    var el=document.getElementById('clock');
    function tick(){
      var d=new Date();
      function p(n){return String(n).padStart(2,'0');}
      el.textContent=p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds())+' UTC';
    }
    setInterval(tick,1000);tick();
  })();

  if(typeof THREE==='undefined'){
    document.getElementById('gate').innerHTML='<div class="idx">Three.js failed to load — check your connection.</div>';
    return;
  }

  // =========================================================================
  // Palette
  // =========================================================================
  var VIOLET=0x9B00FF, GREEN=0x00FF41, MAGENTA=0xCC00FF, CYAN=0x00E0FF;
  var BARS=32; // stage EQ resolution

  // =========================================================================
  // Renderer / scene / camera
  // =========================================================================
  var canvas=document.getElementById('scene');
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setClearColor(0x000000,0); // transparent — the bg video shows through

  var scene=new THREE.Scene();
  scene.background=null;               // no opaque backdrop, so video is visible
  scene.fog=new THREE.FogExp2(0x06001A,0.022); // keep depth haze in the scene's own color

  var camera=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,0.1,300);
  camera.position.set(0,4.5,26);

  // =========================================================================
  // Curved-world bend — a view-space vertex shader that pulls distant / side
  // geometry downward, so the flat grid reads like the horizon of a small
  // sphere. Applied to every material we want to sit on that curved world.
  // =========================================================================
  var CURVE=0.0019; // bigger = tighter sphere (more curvature)
  function applyCurve(mat){
    mat.onBeforeCompile=function(shader){
      shader.uniforms.uCurve={value:CURVE};
      shader.vertexShader='uniform float uCurve;\n'+shader.vertexShader.replace(
        '#include <project_vertex>',
        [
          'vec4 mvPosition = vec4( transformed, 1.0 );',
          '#ifdef USE_INSTANCING',
          '  mvPosition = instanceMatrix * mvPosition;',
          '#endif',
          'mvPosition = modelViewMatrix * mvPosition;',
          'mvPosition.y -= uCurve * ( mvPosition.z * mvPosition.z + mvPosition.x * mvPosition.x );',
          'gl_Position = projectionMatrix * mvPosition;'
        ].join('\n')
      );
    };
    return mat;
  }

  // =========================================================================
  // Floor grid (synthwave — scrolls toward the viewer, curved by the shader)
  // =========================================================================
  var gridGroup=new THREE.Group();
  scene.add(gridGroup);
  var GRID_SIZE=120, GRID_DIV=48;
  // Build a grid whose lines are subdivided, so the shader bend curves them
  // smoothly instead of snapping straight chords between distant endpoints.
  function makeCurvedGrid(size,div,color,opacity){
    var half=size/2, step=size/div, sub=5, N=div*sub, verts=[];
    for(var xi=0;xi<=div;xi++){            // lines running along Z (constant x)
      var x=-half+xi*step;
      for(var s=0;s<N;s++){
        verts.push(x,0,-half+(s/N)*size, x,0,-half+((s+1)/N)*size);
      }
    }
    for(var zi=0;zi<=div;zi++){            // lines running along X (constant z)
      var z=-half+zi*step;
      for(var s2=0;s2<N;s2++){
        verts.push(-half+(s2/N)*size,0,z, -half+((s2+1)/N)*size,0,z);
      }
    }
    var geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
    var mat=applyCurve(new THREE.LineBasicMaterial({color:color,transparent:true,opacity:opacity}));
    return new THREE.LineSegments(geo,mat);
  }
  var gridA=makeCurvedGrid(GRID_SIZE,GRID_DIV,VIOLET,0.22);
  var gridB=makeCurvedGrid(GRID_SIZE,GRID_DIV,VIOLET,0.22);
  gridB.position.z=-GRID_SIZE;
  gridGroup.add(gridA,gridB);
  gridGroup.position.y=0;

  // faint curved "ceiling" grid overhead (you're inside the sphere)
  var ceil=makeCurvedGrid(GRID_SIZE,GRID_DIV,GREEN,0.05);
  ceil.position.y=26;
  scene.add(ceil);

  // =========================================================================
  // The STAGE — a spectrum of reactive bars ahead of you
  // =========================================================================
  var stage=new THREE.Group();
  stage.position.set(0,0,-30);
  scene.add(stage);

  var barMeshes=[];
  var barGeo=new THREE.BoxGeometry(0.85,1,0.85);
  for(var i=0;i<BARS;i++){
    var hue=i/BARS;
    var col=new THREE.Color().lerpColors(new THREE.Color(VIOLET),new THREE.Color(GREEN),hue);
    var mat=applyCurve(new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.9}));
    var m=new THREE.Mesh(barGeo,mat);
    m.position.x=(i-(BARS-1)/2)*1.05;
    m.position.y=0.5;
    barMeshes.push(m);
    stage.add(m);
    // mirror bar for a "reflection" below the floor line
    var mm=new THREE.Mesh(barGeo,applyCurve(new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.15})));
    mm.position.x=m.position.x;mm.scale.y=-1;m.userData.mirror=mm;
    stage.add(mm);
  }

  // orb — wireframe icosahedron that pulses; sits behind + below the bars,
  // low on the curved horizon, clear of the spectrum strip.
  var orbGeo=new THREE.IcosahedronGeometry(3.4,1);
  var orbMat=applyCurve(new THREE.MeshBasicMaterial({color:MAGENTA,wireframe:true,transparent:true,opacity:0.55}));
  var orb=new THREE.Mesh(orbGeo,orbMat);
  orb.position.set(0,11.5,-11);
  stage.add(orb);
  var orbCore=new THREE.Mesh(new THREE.IcosahedronGeometry(2.0,0),
    applyCurve(new THREE.MeshBasicMaterial({color:VIOLET,transparent:true,opacity:0.25})));
  orbCore.position.copy(orb.position);
  stage.add(orbCore);

  // =========================================================================
  // Laser beams sweeping from the stage
  // =========================================================================
  var lasers=[];
  var laserGeo=new THREE.CylinderGeometry(0.03,0.03,60,6,1,true);
  for(var L=0;L<7;L++){
    var lc=(L%2===0)?GREEN:VIOLET;
    var lmat=new THREE.MeshBasicMaterial({color:lc,transparent:true,opacity:0.35});
    var laser=new THREE.Mesh(laserGeo,lmat);
    laser.position.set((L-3)*3,10,-28);
    laser.userData.phase=Math.random()*Math.PI*2;
    laser.userData.speed=0.4+Math.random()*0.5;
    lasers.push(laser);
    scene.add(laser);
  }

  // =========================================================================
  // Rising particle field (the "crowd energy")
  // =========================================================================
  var PCOUNT=1400;
  var pPos=new Float32Array(PCOUNT*3);
  var pVel=new Float32Array(PCOUNT);
  var pCol=new Float32Array(PCOUNT*3);
  var cViolet=new THREE.Color(VIOLET), cGreen=new THREE.Color(GREEN), cCyan=new THREE.Color(CYAN);
  function seedParticle(i,init){
    pPos[i*3]=(Math.random()-0.5)*90;
    pPos[i*3+1]=init?Math.random()*30:-2;
    pPos[i*3+2]=(Math.random()-0.5)*90-10;
    pVel[i]=0.04+Math.random()*0.13;
    var pick=Math.random();
    var c=pick<0.45?cViolet:(pick<0.8?cGreen:cCyan);
    pCol[i*3]=c.r;pCol[i*3+1]=c.g;pCol[i*3+2]=c.b;
  }
  for(var p=0;p<PCOUNT;p++) seedParticle(p,true);
  var pGeo=new THREE.BufferGeometry();
  pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
  var pMat=new THREE.PointsMaterial({size:0.28,vertexColors:true,transparent:true,
    opacity:0.85,depthWrite:false,blending:THREE.AdditiveBlending});
  var points=new THREE.Points(pGeo,pMat);
  scene.add(points);

  // =========================================================================
  // Pulsing point lights (mostly for atmosphere on the orb/bars if lit mats used)
  // =========================================================================
  var lightV=new THREE.PointLight(VIOLET,1.4,80);
  lightV.position.set(-12,14,-20);scene.add(lightV);
  var lightG=new THREE.PointLight(GREEN,1.1,80);
  lightG.position.set(12,10,-24);scene.add(lightG);

  // =========================================================================
  // AUDIO — self-contained synthesized beat + analyser (no external files)
  // =========================================================================
  var audioCtx=null, analyser=null, freqData=null, srcNode=null, gainNode=null;
  var muted=false, vol=0.8; // start 20% below full volume
  var video=document.getElementById('bg-video');
  if(video) video.volume=vol;

  // Route the video's ORIGINAL audio through a gain (volume) + analyser so the
  // visuals react to the real soundtrack (the synthesized beat has been removed).
  function initAudio(){
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC || !video) return false;
    try{
      audioCtx=new AC();
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=256;
      analyser.smoothingTimeConstant=0.6;
      freqData=new Uint8Array(analyser.frequencyBinCount);
      gainNode=audioCtx.createGain();
      gainNode.gain.value=vol;
      srcNode=audioCtx.createMediaElementSource(video);
      srcNode.connect(analyser);
      analyser.connect(gainNode);
      gainNode.connect(audioCtx.destination);
    }catch(e){ return false; }
    return true;
  }

  // =========================================================================
  // Interaction — parallax + enter gate + mute
  // =========================================================================
  var targetX=0, targetY=0, mouseX=0, mouseY=0;
  window.addEventListener('mousemove',function(e){
    mouseX=(e.clientX/window.innerWidth-0.5);
    mouseY=(e.clientY/window.innerHeight-0.5);
  });
  window.addEventListener('touchmove',function(e){
    if(e.touches[0]){
      mouseX=(e.touches[0].clientX/window.innerWidth-0.5);
      mouseY=(e.touches[0].clientY/window.innerHeight-0.5);
    }
  },{passive:true});

  var started=false;
  var gate=document.getElementById('gate');
  var gateTitle=document.getElementById('gate-title');
  // idle glitch flicker on the gate title
  setInterval(function(){
    if(started) return;
    gateTitle.classList.add('glitch');
    setTimeout(function(){gateTitle.classList.remove('glitch');},180+Math.random()*160);
  },1400);

  function enter(){
    if(started) return;
    started=true;
    if(initAudio()){
      if(audioCtx.state==='suspended') audioCtx.resume();
    }
    if(video){
      video.muted=false;   // the click is the user gesture browsers require for sound
      try{video.currentTime=0;}catch(e){}
      var pr=video.play(); if(pr&&pr.catch) pr.catch(function(){});
    }
    gate.classList.add('gone');
  }
  gate.addEventListener('click',enter);

  var muteBtn=document.getElementById('mute');
  muteBtn.addEventListener('click',function(e){
    e.stopPropagation();
    muted=!muted;
    if(video) video.muted=muted;
    muteBtn.textContent='SOUND: '+(muted?'OFF':'ON');
  });

  // volume slider (0..1) — drives the WebAudio gain, with video.volume as fallback
  var volSlider=document.getElementById('vol');
  if(volSlider){
    volSlider.value=vol;
    volSlider.addEventListener('input',function(e){
      e.stopPropagation();
      vol=parseFloat(volSlider.value);
      if(gainNode) gainNode.gain.setTargetAtTime(vol,audioCtx.currentTime,0.01);
      if(video) video.volume=vol;
      if(vol>0 && muted){ muted=false; if(video) video.muted=false; muteBtn.textContent='SOUND: ON'; }
    });
    volSlider.addEventListener('click',function(e){e.stopPropagation();});
  }

  document.getElementById('bpm').textContent='♪ ORIGINAL AUDIO';
  var lvlBar=document.getElementById('lvl');

  // =========================================================================
  // Resize
  // =========================================================================
  function onResize(){
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  }
  window.addEventListener('resize',onResize);

  // =========================================================================
  // Main loop
  // =========================================================================
  var clock=new THREE.Clock();
  var smoothBass=0, smoothMid=0, smoothLevel=0, beatPulse=0;

  function animate(){
    requestAnimationFrame(animate);
    var t=clock.getElapsedTime();
    var dt=clock.getDelta();

    // --- read audio spectrum (or gently idle when silent) ---
    var bassE=0, midE=0, level=0, haveData=false;
    if(analyser && !muted){
      analyser.getByteFrequencyData(freqData);
      var n=freqData.length;
      for(var b=0;b<n;b++){
        var v=freqData[b]/255;
        if(v>0.02) haveData=true;
        level+=v;
        if(b<n*0.18) bassE+=v;
        else if(b<n*0.6) midE+=v;
      }
      bassE/=(n*0.18); midE/=(n*0.42); level/=n;
    }
    if(!haveData){
      // no live spectrum (muted, or analyser blocked) — animate so it's never dead
      bassE=0.35+0.28*Math.sin(t*2.2)+0.12*Math.sin(t*5.3);
      midE=0.3+0.22*Math.sin(t*1.3+1);
      level=0.32+0.16*Math.sin(t*1.7);
    }
    smoothBass+=(bassE-smoothBass)*0.25;
    smoothMid+=(midE-smoothMid)*0.2;
    smoothLevel+=(level-smoothLevel)*0.15;
    beatPulse*=0.9;
    if(smoothBass>0.55 && beatPulse<0.3) beatPulse=1.0;

    // --- scroll the floor grid toward the viewer ---
    var scroll=(3.5+smoothLevel*6)*dt;
    gridA.position.z+=scroll; gridB.position.z+=scroll;
    if(gridA.position.z>=GRID_SIZE) gridA.position.z-=GRID_SIZE*2;
    if(gridB.position.z>=GRID_SIZE) gridB.position.z-=GRID_SIZE*2;
    gridA.material.opacity=0.14+smoothLevel*0.35;
    gridB.material.opacity=gridA.material.opacity;

    // --- stage EQ bars (react to live spectrum; animate when none) ---
    for(var i=0;i<BARS;i++){
      var m=barMeshes[i];
      var target, amp;
      if(haveData){
        var idx=Math.floor(i/BARS*freqData.length*0.85);
        amp=freqData[idx]/255;
        target=0.5+Math.pow(amp,1.4)*7.5; // snappier, less squashed => tracks the beat
      }else{
        amp=Math.abs(Math.sin(t*3+i*0.45));
        target=0.5+amp*(1.3+smoothLevel*3);
      }
      m.scale.y+=(target-m.scale.y)*(haveData?0.5:0.18); // faster follow when live
      m.position.y=m.scale.y*0.5;
      m.material.opacity=0.5+Math.min(0.5,amp*0.5);
      var mir=m.userData.mirror;
      mir.scale.y=-m.scale.y;mir.position.y=-m.scale.y*0.5;
    }

    // --- orb pulse & spin ---
    var orbScale=1+smoothBass*0.35+beatPulse*0.25;
    orb.scale.setScalar(orbScale);
    orb.rotation.y+=dt*0.3;orb.rotation.x+=dt*0.12;
    orb.material.opacity=0.4+smoothMid*0.5;
    orbCore.scale.setScalar(1+beatPulse*0.5);
    orbCore.rotation.y-=dt*0.5;
    orbCore.material.opacity=0.15+beatPulse*0.4;

    // --- lasers sweep ---
    for(var Li=0;Li<lasers.length;Li++){
      var ls=lasers[Li];
      ls.rotation.z=Math.sin(t*ls.userData.speed+ls.userData.phase)*0.6;
      ls.rotation.x=Math.PI/2.3+Math.sin(t*0.4+ls.userData.phase)*0.15;
      ls.material.opacity=(0.12+smoothMid*0.5)*(0.6+0.4*Math.sin(t*3+Li));
    }

    // --- particles rise ---
    var posArr=pGeo.attributes.position.array;
    var lift=1+smoothLevel*2.5+beatPulse*1.5;
    for(var pi=0;pi<PCOUNT;pi++){
      posArr[pi*3+1]+=pVel[pi]*lift;
      if(posArr[pi*3+1]>30) seedParticle(pi,false);
    }
    pGeo.attributes.position.needsUpdate=true;
    points.rotation.y=t*0.02;
    pMat.size=0.24+beatPulse*0.22;

    // --- lights breathe ---
    lightV.intensity=1.0+smoothBass*2.2;
    lightG.intensity=0.8+smoothMid*1.8;
    ceil.material.opacity=0.03+smoothLevel*0.08;

    // --- camera: crowd bob + look toward stage + mouse parallax ---
    targetX+=(mouseX-targetX)*0.05;
    targetY+=(mouseY-targetY)*0.05;
    camera.position.x=targetX*8+Math.sin(t*0.7)*0.6;
    camera.position.y=4.5+Math.sin(t*1.9)*0.25*(1+smoothBass)-targetY*3;
    camera.position.z=26-beatPulse*0.6;
    camera.lookAt(0,15+targetY*-4+smoothBass*1.5,-30);
    camera.fov=70+beatPulse*2.5;
    camera.updateProjectionMatrix();

    // --- HUD level meter ---
    if(lvlBar) lvlBar.style.right=(100-Math.min(100,smoothLevel*180))+'%';

    renderer.render(scene,camera);
  }
  animate();
})();
</script>
</body>
</html>
